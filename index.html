<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Debate Timer</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=VT323&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&family=Source+Code+Pro:wght@300;400&family=Orbitron:wght@400;700;900&family=Cutive+Mono&family=Ubuntu+Mono:wght@400;700&family=Share+Tech+Mono&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">

<style>
  @keyframes timerStartGlow {
  0% {
    filter: drop-shadow(0 0 0px var(--accent));
    transform: scale(1);
  }
  25% {
    filter: drop-shadow(0 0 25px var(--accent));
    transform: scale(1.02);
  }
  60% {
    filter: drop-shadow(0 0 12px var(--accent));
  }
  100% {
    filter: drop-shadow(0 0 0px var(--accent));
    transform: scale(1);
  }
}

.glow-start {
  animation: timerStartGlow 0.6s ease-out;
}

/* overtime: red flashing digits, used once elapsed passes the speech duration */
@keyframes overtimeFlash{
  0%,100%{opacity:1;text-shadow:0 0 6px #ff3b3b, 0 0 14px rgba(255,59,59,0.55);}
  50%{opacity:0.35;text-shadow:0 0 14px #ff3b3b, 0 0 28px rgba(255,59,59,0.75);}
}

:root{
  --bg:#0b0f1a;
  --fg:#e8f0ff;
  --accent:#7cf7ff;
  --ring:#2a3350;
  --card:rgba(255,255,255,0.06);
  --panel-radius:14px;
  --panel-border:1px solid rgba(255,255,255,0.12);
}

*{box-sizing:border-box;font-family:"JetBrains Mono", monospace;}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--fg);
  display:flex;
  align-items:center;
  justify-content:center;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transition:background-color .3s;
}

/* ===== THEMES ===== */
body.dark{--accent:#7cf7ff;}
body.light{--bg:#f5f7ff;--fg:#111;--accent:#ff4d4d;--ring:#cfd6ff;}
body.min-dark{--bg:#111;--fg:#ddd;--accent:#aaa;--ring:#333;}
body.min-light{--bg:#fafafa;--fg:#000;--accent:#000;--ring:#00000033;}

body.professional{--bg:#0e1a2b;--fg:#dde3ea;--accent:#aab4c2;--ring:#25344a;--panel-radius:6px;--panel-border:1px solid rgba(170,180,194,0.35);}
body.professional, body.professional .label, body.professional #speech, body.professional p, body.professional .btn, body.professional .dropdown-toggle, body.professional .dropdown-item{
  font-family:'Cormorant Garamond', serif;
  font-weight:300;
  letter-spacing:0.03em;
}

body.aesthetic, body.aesthetic .label, body.aesthetic #speech, body.aesthetic p, body.aesthetic .btn, body.aesthetic .dropdown-toggle, body.aesthetic .dropdown-item{
  font-family:'Playfair Display', serif;
}

body.hacker{--bg:#000;--fg:#00ff66;--accent:#00ff66;--panel-radius:0px;--panel-border:1px solid rgba(0,255,102,0.4);}
body.hacker, body.hacker .label, body.hacker #speech, body.hacker p, body.hacker .btn, body.hacker .dropdown-toggle, body.hacker .dropdown-item{
  font-family:'VT323', monospace;
  font-size:1.1em;
}

/* ===== HACKER THEME CRT EFFECT ===== */
@keyframes crtFlicker{
  0%,100%{opacity:1;}
  92%{opacity:1;}
  93%{opacity:.85;}
  94%{opacity:1;}
  96%{opacity:.92;}
  97%{opacity:1;}
}

body.hacker::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,255,102,0.09) 0px,
    rgba(0,255,102,0.09) 1px,
    transparent 2px,
    transparent 4px
  );
  mix-blend-mode:overlay;
  animation:crtFlicker 6s infinite;
}

body.hacker::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
}

body.hacker .time,
body.hacker .prep-time,
body.hacker .label{
  text-shadow:0 0 6px var(--accent), 0 0 14px rgba(0,255,102,0.5);
}

body.hacker .bg-ring{stroke:#0a3d1f;}
body.hacker .progress,
body.hacker .prep-progress{
  filter:drop-shadow(0 0 6px var(--accent));
}

body.synthwave{--bg:#0a0014;--fg:#ffd6ff;--accent:#ff3df2;--panel-radius:2px;--panel-border:1px solid rgba(255,61,242,0.5);}
body.synthwave, body.synthwave .label, body.synthwave #speech, body.synthwave p, body.synthwave .btn, body.synthwave .dropdown-toggle, body.synthwave .dropdown-item{
  font-family:'Orbitron', sans-serif;
}

body.space, body.space .label, body.space #speech, body.space p, body.space .btn, body.space .dropdown-toggle, body.space .dropdown-item{
  font-family:'Orbitron', sans-serif;
  letter-spacing:0.04em;
}
body.space .time,body.space .prep-time{
  font-family:'Share Tech Mono', monospace;
  text-shadow:0 0 8px var(--accent), 0 0 18px rgba(124,247,255,0.4);
}
body.space .bg-ring{stroke:#1b2540;}
body.space .progress,
body.space .prep-progress{
  filter:drop-shadow(0 0 6px var(--accent));
}
body.space .panel{
  background:rgba(5,8,20,0.72);
  backdrop-filter:blur(14px);
  box-shadow:-1px 0 16px rgba(124,247,255,0.15);
}
body.space .settings-btn{
  background:rgba(5,8,20,0.55);
}

/* numbers always use a monospace font so the digits stay aligned as
   they tick over, but which monospace font depends on the theme */
.time,.prep-time{
  font-family:"JetBrains Mono", monospace;
}
body.dark .time,body.dark .prep-time,
body.light .time,body.light .prep-time{
  font-family:"JetBrains Mono", monospace;
}
body.professional .time,body.professional .prep-time{
  font-family:"Source Code Pro", monospace;
  font-weight:300;
  letter-spacing:0.02em;
}
body.aesthetic .time,body.aesthetic .prep-time{
  font-family:"Cutive Mono", monospace;
}
body.hacker .time,body.hacker .prep-time{
  font-family:"VT323", monospace;
}
body.hacker .time{font-size:3.8rem;}
body.hacker .prep-time{font-size:1.9rem;}
body.synthwave .time,body.synthwave .prep-time{
  font-family:"Share Tech Mono", monospace;
}

/* eastern arabic-indic digits need a font that has those glyphs; fall back to it only for the digit displays */
body.eastern-numerals .time,
body.eastern-numerals .prep-time{
  font-family:"Noto Sans Arabic", "JetBrains Mono", monospace !important;
}

/* ===== LAYOUT ===== */
.wrapper{
  display:flex;
  gap:32px;
  align-items:center;
  justify-content:center;
}

body.portrait .wrapper{flex-direction:column;}
body.landscape .wrapper{flex-direction:row;}

/* ===== RINGS ===== */
.ring,.prep-ring{
  position:relative;
  cursor:pointer;
}

.ring{width:340px;height:340px;}
.prep-ring{width:240px;height:240px;}

svg{transform:rotate(-90deg);}
circle{fill:none;stroke-width:10;stroke-linecap:round;}

.bg-ring{stroke:var(--ring);}
.progress,.prep-progress{stroke:var(--accent);}

.time,.prep-time{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.time{font-size:3.23rem;transition:color .2s;}
.prep-time{font-size:1.6rem;transition:color .2s;}

.time.warn,.prep-time.warn{color:#ff3b3b;}

/* overtime overrides warn: flashing red, applied once time has run past the allotted duration */
.time.overtime,.prep-time.overtime{
  color:#ff3b3b;
  animation:overtimeFlash 0.85s ease-in-out infinite;
}

.label{
  position:absolute;
  top:28%;
  left:50%;
  transform:translateX(-50%);
  font-size:1.15rem;
}

/* ===== SETTINGS FIXED ON TOP ===== */
.settings-btn{
  position:absolute;
  top:15px;
  right:15px;
  z-index:99999;
  background:var(--card);
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.panel{
  position:fixed;
  top:0;
  right:0;
  width:280px;
  height:100%;
  background:var(--card);
  backdrop-filter:blur(12px);
  transform:translateX(100%);
  transition:.25s;
  z-index:99998;
  padding:15px;
  overflow-y:auto;
  border-left:var(--panel-border);
}

.panel.open{transform:translateX(0);}

/* per-theme panel appearance — opacity and blur vary by theme so the
   panel itself feels like part of that theme, not just a fixed overlay */
body.dark .panel{background:rgba(20,26,44,0.62);backdrop-filter:blur(14px);}
body.light .panel{background:rgba(255,255,255,0.68);backdrop-filter:blur(14px);}
body.min-dark .panel{background:rgba(17,17,17,0.5);backdrop-filter:blur(8px);}
body.min-light .panel{background:rgba(250,250,250,0.55);backdrop-filter:blur(8px);}
body.professional .panel{background:rgba(14,26,43,0.97);backdrop-filter:blur(3px);box-shadow:-1px 0 14px rgba(170,180,194,0.12);}
body.aesthetic .panel{background:rgba(255,227,241,0.82);backdrop-filter:blur(18px);}
body.hacker .panel{background:rgba(0,10,0,0.93);backdrop-filter:blur(2px);box-shadow:-1px 0 12px rgba(0,255,102,0.15);}
body.synthwave .panel{background:rgba(15,0,25,0.85);backdrop-filter:blur(10px);box-shadow:-1px 0 16px rgba(255,61,242,0.25);}

.panel .btn,.panel select{border-radius:var(--panel-radius);}

.overlay{
  position:fixed;
  inset:0;
  display:none;
  z-index:99997;
}
.overlay.show{display:block;}

/* ===== SWITCHES ===== */
.switch{
  position:relative;
  display:inline-block;
  width:52px;
  height:28px;
}

.switch input{display:none;}

.slider{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.15);
  border-radius:999px;
  transition:.25s;
  box-shadow:0 0 0 0 var(--accent);
}

.switch input:checked + .slider{
  box-shadow:0 0 10px 2px var(--accent), 0 0 18px 4px var(--accent);
}

.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  top:3px;
  left:3px;
  border-radius:50%;
  background:var(--accent);
  transition:.25s;
  box-shadow:0 0 10px var(--accent);
}

.switch input:checked + .slider:before{
  transform:translateX(24px);
}

/* buttons */
.btn{
  margin:4px;
  padding:7px;
  border:1px solid var(--accent);
  background:transparent;
  color:var(--fg);
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

/* ===== MORE OPTIONS ACCORDION ===== */
.more-options{
  margin-top:10px;
  border-top:1px solid rgba(255,255,255,0.12);
  padding-top:6px;
}

.more-toggle{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:transparent;
  border:1px solid var(--accent);
  color:var(--fg);
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
}

.more-arrow{
  display:inline-block;
  transition:transform .25s ease;
  font-size:11px;
}

.more-arrow.open{
  transform:rotate(180deg);
}

.more-content{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}

.more-content.open{
  max-height:420px;
  overflow:visible;
}

.more-content-inner{
  padding-top:8px;
}

/* ===== CUSTOM THEME DROPDOWN ===== */
.custom-dropdown{
  position:relative;
  width:100%;
  margin-top:6px;
}

.dropdown-toggle{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  border:1px solid var(--accent);
  background:var(--bg);
  color:var(--fg);
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
}

.dropdown-arrow{
  font-size:11px;
  transition:transform .2s ease;
  color:var(--accent);
}

.custom-dropdown.open .dropdown-arrow{
  transform:rotate(180deg);
}

.dropdown-menu{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 6px);
  background:var(--bg);
  border:1px solid var(--accent);
  border-radius:8px;
  max-height:0;
  overflow:hidden auto;
  opacity:0;
  transition:max-height .22s ease, opacity .18s ease;
  z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.custom-dropdown.open .dropdown-menu{
  max-height:240px;
  opacity:1;
}

.dropdown-item{
  padding:9px 12px;
  font-size:13px;
  cursor:pointer;
  color:var(--fg);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.dropdown-item:hover{
  background:rgba(255,255,255,0.08);
}

.dropdown-item.selected{
  color:var(--accent);
  font-weight:700;
}

.dropdown-check{
  opacity:0;
  color:var(--accent);
  font-size:12px;
}

.dropdown-item.selected .dropdown-check{
  opacity:1;
}
</style>
</head>

<body class="dark portrait">

<div class="settings-btn" id="settingsBtn">⚙</div>
<div class="overlay" id="overlay"></div>

<div class="panel" id="panel">
<button class="btn" id="close">Close</button>

<p>Layout (📱 / 💻) </p>
<label class="switch">
<input type="checkbox" id="layoutSwitch">
<span class="slider"></span>
</label>

<p>Format (LD / WSD)</p>
<label class="switch">
<input type="checkbox" id="formatSwitch">
<span class="slider"></span>
</label>

<p>Timer / Stopwatch</p>
<label class="switch">
<input type="checkbox" id="modeSwitch">
<span class="slider"></span>
</label>

<div class="more-options">
<button class="more-toggle" id="moreToggle" type="button">
<span>More options</span>
<span class="more-arrow" id="moreArrow">▾</span>
</button>

<div class="more-content" id="moreContent">
<div class="more-content-inner">

<p>Glow Animation (Off / On)</p>
<label class="switch">
<input type="checkbox" id="glowSwitch">
<span class="slider"></span>
</label>

<p>123 / ١٢٣</p>
<label class="switch">
<input type="checkbox" id="numeralSwitch">
<span class="slider"></span>
</label>

<p>Theme</p>
<div class="custom-dropdown" id="themeDropdown">
<button class="dropdown-toggle" id="themeToggle" type="button">
<span id="themeLabel">Dark</span>
<span class="dropdown-arrow">▾</span>
</button>
<div class="dropdown-menu" id="themeMenu">
<div class="dropdown-item selected" data-value="dark">Dark<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="light">Light<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="min-dark">Min Dark<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="min-light">Min Light<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="professional">Professional<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="aesthetic">Aesthetic<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="hacker">Hacker<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="synthwave">Neon<span class="dropdown-check">✓</span></div>
<div class="dropdown-item" data-value="space">Space<span class="dropdown-check">✓</span></div>
</div>
</div>

</div>
</div>
</div>
</div>

<div class="wrapper">

<div class="prep-ring" id="prepRing">
  <div class="label">PREP</div>
  <svg viewBox="0 0 200 200">
    <circle class="bg-ring" cx="100" cy="100" r="70"></circle>
    <circle class="prep-progress" cx="100" cy="100" r="70"></circle>
  </svg>
  <div class="prep-time" id="prepTime">04:00.00</div>
</div>

<div class="ring" id="mainRing">
  <div class="label" id="speech">Ready</div>
  <svg viewBox="0 0 280 280">
    <circle class="bg-ring" cx="140" cy="140" r="110"></circle>
    <circle class="progress" cx="140" cy="140" r="110"></circle>
  </svg>
  <div class="time" id="time">00:00.00</div>
</div>

</div>

<script>

/* ===== STATE ===== */
let i=0,running=false,start=0,elapsed=0;
let wsMode=false;
let mode="timer"; // timer vs stopwatch
let glowEnabled = false;
let prepRunning=false,prepStart=0,prepElapsed=0;
let prepDuration=240000;
let currentTheme="dark";
let currentLayout="portrait";
let easternNumerals=false;

/* ===== NUMERAL CONVERSION ===== */
const easternDigits=["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toDisplayDigits(str){
if(!easternNumerals) return str;
return str.replace(/[0-9]/g,d=>easternDigits[+d]);
}

/* speeches */
const speeches=[
{n:"AC",d:360},{n:"CX",d:180},{n:"NC",d:420},{n:"CX",d:180},
{n:"1AR",d:240},{n:"NR",d:360},{n:"2AR",d:180}
];

const wsSpeech=[
{n:"Prop 1",d:480},{n:"Opp 1",d:480},{n:"Prop 2",d:480},{n:"Opp 2",d:480},
{n:"Prop 3",d:480},{n:"Opp 3",d:480},{n:"Opp Rep",d:240},{n:"Prop Rep",d:240}
];

const main=document.querySelector(".progress");
const prep=document.querySelector(".prep-progress");

const mainLen=2*Math.PI*110;
const prepLen=2*Math.PI*70;

main.style.strokeDasharray=mainLen;
prep.style.strokeDasharray=prepLen;

/* ===== FORMAT =====
   handles negative ms (overtime countdown) by rendering a leading minus sign */
function fmt(ms){
let neg = ms < 0;
let abs = Math.abs(ms);
let m=Math.floor(abs/60000);
let s=Math.floor((abs%60000)/1000);
let c=Math.floor((abs%1000)/10);
let str=`${neg?"-":""}${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(c).padStart(2,"0")}`;
return toDisplayDigits(str);
}

/* ===== MAIN LOOP ===== */
function tick(t){
if(running){
if(!start) start=t-elapsed;
elapsed=t-start;
}

let list=wsMode?wsSpeech:speeches;
let dur=list[i].d*1000;

/* ✅ TIMER vs STOPWATCH LOGIC
   overtime: once elapsed passes the allotted duration, the timer no
   longer clamps at zero — it counts into negative territory instead,
   and the stopwatch just keeps climbing as it always did. */
let over = elapsed > dur;
let rem = dur - elapsed;
let show = (mode==="timer") ? rem : elapsed;

main.style.strokeDashoffset = mainLen - Math.min(elapsed/dur,1)*mainLen;

speech.textContent=list[i].n;
time.textContent=fmt(show);

if(over){
time.classList.add("overtime");
time.classList.remove("warn");
}else if(mode==="timer" && rem<=10000 && rem>0){
time.classList.add("warn");
time.classList.remove("overtime");
}else{
time.classList.remove("warn","overtime");
}

/* prep (DISABLED in WSD mode) — display now updates every frame,
   not just while running, so a reset is reflected immediately
   even if prepRunning is false at that moment. prep also counts
   into negative/overtime rather than stopping at zero. */
if(!wsMode){
if(prepRunning){
if(!prepStart) prepStart=t-prepElapsed;
prepElapsed=t-prepStart;
}

prep.style.strokeDashoffset=prepLen-Math.min(prepElapsed/prepDuration,1)*prepLen;
let prepRem=prepDuration-prepElapsed;
let prepOver=prepElapsed>prepDuration;
prepTime.textContent=fmt(prepRem);

if(prepOver){
prepTime.classList.add("overtime");
prepTime.classList.remove("warn");
}else if(prepRem<=10000 && prepRem>0){
prepTime.classList.add("warn");
prepTime.classList.remove("overtime");
}else{
prepTime.classList.remove("warn","overtime");
}
}

requestAnimationFrame(tick);
}

/* ===== CONTROLS ===== */
/* custom double-click detection with a tighter threshold than the
   browser's native dblclick, so a reset requires two genuinely fast clicks */
const DBLCLICK_MS = 220;
let mainLastClick = 0;
let mainClickTimer = null;
let prepLastClick = 0;
let prepClickTimer = null;

mainRing.onclick = () => {
const now = performance.now();
if (now - mainLastClick < DBLCLICK_MS) {
clearTimeout(mainClickTimer);
mainLastClick = 0;
elapsed = 0;
running = false;
start = 0;
return;
}
mainLastClick = now;
mainClickTimer = setTimeout(() => {
running = !running;

if (running) {
start = performance.now() - elapsed;

/* glow only if enabled */
if (glowEnabled) {
mainRing.classList.remove("glow-start");
void mainRing.offsetWidth;
mainRing.classList.add("glow-start");
}
}
}, DBLCLICK_MS);
};

prepRing.onclick = () => {
const now = performance.now();
if (now - prepLastClick < DBLCLICK_MS) {
clearTimeout(prepClickTimer);
prepLastClick = 0;
prepElapsed = 0;
prepRunning = false;
prepStart = 0;
return;
}
prepLastClick = now;
prepClickTimer = setTimeout(() => {
prepRunning = !prepRunning;
if (prepRunning) prepStart = performance.now() - prepElapsed;
}, DBLCLICK_MS);
};

/* swipe */
let sx=0;
document.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
if(Math.abs(dx)>50)dx<0?next():prev();
});

/* keyboard */
document.addEventListener("keydown",e=>{
if(e.key===" "){e.preventDefault();running=!running;if(running)start=performance.now()-elapsed;}
if(e.key==="ArrowRight")next();
if(e.key==="ArrowLeft")prev();
if(e.key==="r"){elapsed=0;running=false;}
if(e.key==="p")prepRunning=!prepRunning;
});

/* nav */
function next(){i=Math.min(wsMode?wsSpeech.length-1:speeches.length-1,i+1);reset();}
function prev(){i=Math.max(0,i-1);reset();}
function reset(){elapsed=0;running=false;}

/* apply body classes from current theme + layout + numeral state */
function applyBodyClass(){
document.body.className = currentTheme + " " + currentLayout + (easternNumerals ? " eastern-numerals" : "");
}

/* switches */
document.getElementById("formatSwitch").onchange=e=>{
wsMode=e.target.checked;i=0;reset();
};

document.getElementById("layoutSwitch").onchange=e=>{
currentLayout = e.target.checked ? "landscape" : "portrait";
applyBodyClass();
};
  
document.getElementById("glowSwitch").onchange = e => {
glowEnabled = e.target.checked;
};
  
/* ✅ MODE SWITCH */
document.getElementById("modeSwitch").onchange=e=>{
mode = e.target.checked ? "stopwatch" : "timer";
};

/* ✅ NUMERAL SWITCH */
document.getElementById("numeralSwitch").onchange=e=>{
easternNumerals = e.target.checked;
applyBodyClass();
};

/* settings */
const panel=document.getElementById("panel");
const overlay=document.getElementById("overlay");

document.getElementById("settingsBtn").onclick=()=>{
panel.classList.add("open");
overlay.classList.add("show");
};

function close(){
panel.classList.remove("open");
overlay.classList.remove("show");
}
document.getElementById("close").onclick=close;
overlay.onclick=close;

/* more options accordion */
const moreToggle=document.getElementById("moreToggle");
const moreContent=document.getElementById("moreContent");
const moreArrow=document.getElementById("moreArrow");

moreToggle.onclick=()=>{
moreContent.classList.toggle("open");
moreArrow.classList.toggle("open");
};

/* custom theme dropdown */
const themeDropdown=document.getElementById("themeDropdown");
const themeToggle=document.getElementById("themeToggle");
const themeMenu=document.getElementById("themeMenu");
const themeLabel=document.getElementById("themeLabel");
const themeItems=document.querySelectorAll("#themeMenu .dropdown-item");

themeToggle.onclick=(e)=>{
e.stopPropagation();
themeDropdown.classList.toggle("open");
};

themeItems.forEach(item=>{
item.onclick=()=>{
currentTheme=item.dataset.value;
themeLabel.textContent=item.childNodes[0].textContent;
themeItems.forEach(i=>i.classList.remove("selected"));
item.classList.add("selected");
applyBodyClass();
themeDropdown.classList.remove("open");
};
});

document.addEventListener("click",(e)=>{
if(!themeDropdown.contains(e.target)){
themeDropdown.classList.remove("open");
}
});

requestAnimationFrame(tick);

</script>

</body>
</html>
